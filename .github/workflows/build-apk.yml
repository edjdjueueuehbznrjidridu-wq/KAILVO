name: Build APEX Native APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          if [ -f main.py ] && [ -f buildozer.spec ]; then
            echo "already at root"
            ls -la
            exit 0
          fi
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1)
          echo "Using ZIP=$ZIP"
          unzip -o "$ZIP" -d _e
          if [ -f _e/main.py ]; then
            cp -a _e/. .
          elif [ -f _e/APEX_SUPER_GitHub_Ready.zip ]; then
            unzip -o _e/APEX_SUPER_GitHub_Ready.zip -d _p
            if [ -f _p/main.py ]; then
              cp -a _p/. .
            else
              SUB=$(find _p -name main.py | head -1 | xargs dirname)
              cp -a "$SUB"/. .
            fi
          else
            SUB=$(find _e -name main.py | head -1 | xargs dirname)
            cp -a "$SUB"/. .
          fi
          echo "=== after extract ==="
          ls -la
          test -f main.py
          test -f buildozer.spec
          test -d apex

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git unzip zip openjdk-17-jdk python3-pip python3-setuptools \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev libltdl-dev \
            libjpeg-dev libpng-dev gettext libsqlite3-dev \
            ccache build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'cython<3.0'
          python -m pip install buildozer
          buildozer --version

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug

      - name: Show bin
        if: always()
        run: ls -la bin/ || true; find . -name '*.apk' 2>/dev/null | head

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Exchange-Native-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 21
